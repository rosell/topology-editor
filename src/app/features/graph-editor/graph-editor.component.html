<div class="controls-panel p-4 mb-4 bg-gray-100 rounded-md shadow">
  <h3 class="text-lg font-semibold mb-2">Add Nodes</h3>
  <div class="space-x-2">
    <button (click)="addNode('C0')" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">Add C0 Node</button>
    <button (click)="addNode('C1')" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Add C1 Node</button>
    <button (click)="addNode('C2')" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add C2 Node</button>
  </div>
  <h3 class="text-lg font-semibold mt-4 mb-2">Add Edges (Select Source, then Target Node)</h3>
  <div class="space-x-2">
    <button (click)="createEdge('data')" [disabled]="!selectedSourceNodeId || !selectedTargetNodeId" class="bg-sky-500 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400">Create Data Edge</button>
    <button (click)="createEdge('control')" [disabled]="!selectedSourceNodeId || !selectedTargetNodeId" class="bg-emerald-500 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded disabled:bg-gray-400">Create Control Edge</button>
  </div>
</div>
<div class="graph-editor-container">
  <cytoscape
    [elements]="graphData"
    [layout]="layout"
    [style]="style"
    (ready)="onCyReady($event)"
    class="graph-display-area"
  >
  </cytoscape>
</div>
